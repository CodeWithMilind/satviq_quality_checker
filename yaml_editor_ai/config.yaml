# YAML Editor AI — independent configuration.
#
# This module improves the completeness YAML keyword configuration
# from real resume terminology. It is deliberately INDEPENDENT from
# the main Muse AI resume-extraction configuration (muse_ai/):
# separate credentials, separate model default, separate token
# tracking, separate analytics.
#
# Credentials come from environment variables ONLY (never hardcoded):
#   YAML_EDITOR_API_KEY   editor-specific key (preferred)
#   MUSE_API_KEY          fallback when no editor-specific key exists
#   YAML_EDITOR_BASE_URL  default https://api.meta.ai/v1
#   YAML_EDITOR_MODEL     default muse-spark-1.3-contributor
#   YAML_EDITOR_ENABLED   "false" disables the agent entirely
#
# The project .env file is honoured via muse_ai.config.load_env_file
# (the same loader the main backend uses).

enabled: true

# Model identity (env YAML_EDITOR_MODEL overrides the model name).
provider: "Muse AI"
default_model: "muse-spark-1.3-contributor"
default_base_url: "https://api.meta.ai/v1"

# The editor's OWN request timeout. Unlike the main resume pipeline
# (whose Muse calls wait indefinitely by product decision), a YAML
# improvement call must never hang post-processing: on timeout the
# update is skipped and logged, the resume record is unaffected.
timeout_seconds: 60
# Completion budget. 600 was the PROVEN root cause of the empty
# responses: Muse Spark spends part of this budget on hidden
# reasoning tokens BEFORE any visible text, so a 600 cap could be
# exhausted with zero content produced (finish_reason=length,
# reasoning_tokens=600, content empty). 1000 leaves room for the
# reasoning share plus the small JSON answer (the validator caps
# accepted output at 12 keywords, so replies stay tiny).
max_output_tokens: 1000
temperature: 0.0

# Reasoning depth. Muse Spark is a reasoning model: it reasons at
# "high" effort BY DEFAULT when reasoning_effort is omitted, and
# reasoning tokens are charged against max_completion_tokens BEFORE
# any visible text — at high effort the model consumed the ENTIRE
# 600-token budget (first failure) and then the entire 2000-token
# combined budget (second failure) without emitting any content.
# This task is a direct lookup/extraction, so "minimal" (the
# shortest reasoning pass the API supports; "none" is rejected with
# HTTP 400 on Muse reasoning models) keeps reasoning to a small
# fraction of the budget and leaves the rest for the JSON answer.
reasoning_effort: "minimal"

# Trigger: run ONLY as a post-processing step after the final
# extractor has been selected, and only when the SELECTED attempt's
# completeness score is below this threshold. High-quality resumes
# never trigger the agent.
trigger_completeness_below: 75.0
# Minimum usable extracted text (characters) for an analysis.
min_text_chars: 200
# Cap on resume text sent to the model (token discipline).
max_resume_chars: 6000

# Deterministic keyword validation limits.
max_keyword_chars: 60
max_keywords_per_category: 5
max_keywords_total: 12

# Storage layout (relative to the project root).
yaml_dir: "yaml files"
usage_file: "yaml_editor_ai/token_usage.json"
