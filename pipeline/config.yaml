# Simple Production Pipeline configuration
# All values are optional -- missing keys fall back to defaults in
# pipeline/config.py. No credentials or API keys belong in this file;
# the LLM provider/model are configured via the backend .env (Muse AI).

# Minimum quality score (0-100) a selected extractor must reach.
# If the best extractor scores below this, the pipeline reports
# "below_threshold" instead of silently sending bad text to the LLM.
min_quality_threshold: 60.0

# EXTRACTION-ONLY safety limit (seconds): the maximum time to
# WAIT for one extractor in the sequential run. A stuck-process
# guard, deliberately generous so it never clips legitimate
# extraction (Docling on a large PDF legitimately takes minutes).
# This NEVER applies to Muse AI — Muse calls have no timeout.
# Set to null to disable the guard entirely.
per_extractor_timeout_seconds: 600.0

# Execution order for the sequential quality-gated flow (Tika first,
# then PyMuPDF, then Docling, then OCR) AND the deterministic
# tie-breaking order when two executed extractors score exactly the
# same. Earlier in the list wins. Extraction stops at the first
# extractor whose text passes the Quality Checker gate (the
# quality_gate thresholds in extractor/config/extractor.yaml);
# later extractors are skipped, never executed.
tie_break_order:
  - tika
  - pymupdf
  - docling

# LLM retries AFTER the first attempt, only for transient failures
# (timeout / connection / 429 / 5xx). Invalid JSON is never retried.
llm_max_retries: 2

# Informational only: the existing MuseService does not accept a
# per-call temperature, so this is recorded in the llm block but not
# forced onto the provider. null = provider default.
llm_temperature: null

# Quality scoring weights. They are sum-normalised at scoring time,
# so they do not need to sum to exactly 1.0, but the defaults do.
# - availability:     extraction succeeded and produced meaningful text
# - length_adequacy:  saturating length score min(chars/1500, 1) --
#                     longer is NOT automatically better beyond saturation
# - readability:      proportion of sane alphabetic tokens, punctuation
# - cleanliness:      penalises replacement (\ufffd) and control chars
# - non_duplication:  penalises repeated lines / duplicated content
# - completeness:     contact details + resume section indicators
# - structure:        headings / paragraphs / bullets present
weights:
  availability: 0.10
  length_adequacy: 0.30
  readability: 0.15
  cleanliness: 0.10
  non_duplication: 0.10
  completeness: 0.15
  structure: 0.10
